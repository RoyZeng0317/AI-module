[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-human-image-editor"
version = "0.1.0"
description = "Local CLI image editing toolkit with masks, restoration, and subject extraction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10.0",
  "opencv-python>=4.9",
  "typer>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
subject = ["rembg[cpu]>=2.0.57"]
dev = ["pytest>=8.0"]

[project.scripts]
aihe = "ai_human_image_editor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
